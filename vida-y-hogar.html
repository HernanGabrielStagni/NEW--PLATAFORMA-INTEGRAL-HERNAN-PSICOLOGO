<script>
let _authMode = 'login';
async function authInit() {
  const { data: { session } } = await _sb.auth.getSession();
  if (session) {
    document.getElementById('login-screen').classList.remove('visible');
    document.getElementById('root').style.display = '';
  } else {
    document.getElementById('login-screen').classList.add('visible');
    document.getElementById('root').style.display = 'none';
  }
}
async function authSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-btn');
  const errEl = document.getElementById('auth-error');
  errEl.classList.remove('visible');
  btn.disabled = true;
  btn.textContent = 'Procesando...';
  let result;
  if (_authMode === 'login') {
    result = await _sb.auth.signInWithPassword({ email, password });
  } else {
    result = await _sb.auth.signUp({ email, password });
  }
  if (result.error) {
    errEl.textContent = tradAuth(result.error.message);
    errEl.classList.add('visible');
    btn.disabled = false;
    btn.textContent = _authMode === 'login' ? 'Ingresar' : 'Crear cuenta';
    return;
  }
  if (_authMode === 'register' && !result.data.session) {
    errEl.style.color = '#2d5a3d'; errEl.style.background = '#d4e6da';
    errEl.textContent = 'Cuenta creada. Revisá tu email para confirmar.';
    errEl.classList.add('visible');
    btn.disabled = false; btn.textContent = 'Crear cuenta'; return;
  }
  document.getElementById('login-screen').classList.remove('visible');
  document.getElementById('root').style.display = '';
}
function authToggleMode() {
  _authMode = _authMode === 'login' ? 'register' : 'login';
  const isLogin = _authMode === 'login';
  document.getElementById('auth-title').textContent = isLogin ? 'Vida y Hogar' : 'Crear cuenta';
  document.getElementById('auth-subtitle').textContent = isLogin ? 'Ingresá con tu cuenta' : 'Completá los datos';
  document.getElementById('auth-btn').textContent = isLogin ? 'Ingresar' : 'Crear cuenta';
  document.getElementById('auth-toggle-text').innerHTML = isLogin
    ? '¿No tenés cuenta? <a onclick="authToggleMode()">Registrate</a>'
    : '¿Ya tenés cuenta? <a onclick="authToggleMode()">Iniciá sesión</a>';
  document.getElementById('auth-error').classList.remove('visible');
}
function tradAuth(msg) {
  if (msg.includes('Invalid login')) return 'Email o contraseña incorrectos.';
  if (msg.includes('Email not confirmed')) return 'Confirmá tu email antes de ingresar.';
  if (msg.includes('User already registered')) return 'Este email ya tiene una cuenta.';
  if (msg.includes('Password should be')) return 'La contraseña debe tener al menos 6 caracteres.';
  return msg;
}
async function authSignOut() {
  await _sb.auth.signOut();
  document.getElementById('login-screen').classList.add('visible');
  document.getElementById('root').style.display = 'none';
}
window.addEventListener('DOMContentLoaded', authInit);
</script>

      /* SUB-MÓDULO: SUEÑO                                 */
      /* ═══════════════════════════════════════════════════ */

      /* Convierte "HH:MM" a horas decimales normalizadas.
         Horas 00:00–06:00 se tratan como "tarde" (hora+24).
         Ej: "02:15" → 26.25 | "23:30" → 23.5 */
      function normalizarHoraSueno(horaStr) {
        if (!horaStr) return null;
        const [h, m] = horaStr.split(":").map(Number);
        const dec = h + m / 60;
        return dec < 6 ? dec + 24 : dec;
      }

      /* Duración en minutos entre acostarse y despertar */
      function calcularDuracionMin(
        fechaDormir,
        horaAcostarse,
        fechaDespertar,
        horaDespertar,
      ) {
        if (!fechaDormir || !horaAcostarse || !fechaDespertar || !horaDespertar)
          return null;
        const inicio = new Date(`${fechaDormir}T${horaAcostarse}:00`);
        const fin = new Date(`${fechaDespertar}T${horaDespertar}:00`);
        const diff = fin - inicio;
        return diff > 0 ? Math.round(diff / 60000) : null;
      }

      /* Horas decimales normalizadas → "HH:MM"
         Ej: 26.25 → "02:15" | 23.5 → "23:30" */
      function horaDecAStr(dec) {
        if (dec === null || dec === undefined) return "--:--";
        const h = Math.floor(dec % 24);
        const m = Math.round((dec % 1) * 60);
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      }

      /* Minutos → "Xh YYm" */
      function minAHoras(min) {
        if (!min) return "--";
        const h = Math.floor(min / 60);
        const m = min % 60;
        return m > 0 ? `${h}h ${String(m).padStart(2, "0")}m` : `${h}h`;
      }

      /* Racha actual: días consecutivos cumpliendo meta (hacia atrás desde el más reciente) */
      function calcularRachaSueno(registros, metaHora) {
        if (!registros.length || !metaHora) return 0;
        const metaN = normalizarHoraSueno(metaHora);
        const sorted = [...registros].sort((a, b) =>
          b.fechaDespertar.localeCompare(a.fechaDespertar),
        );
        let racha = 0;
        for (let i = 0; i < sorted.length; i++) {
          if (i > 0) {
            const prev = sorted[i - 1];
            const pd = new Date(prev.fechaDespertar + "T12:00:00");
            pd.setDate(pd.getDate() - 1);
            const exp = `${pd.getFullYear()}-${String(pd.getMonth() + 1).padStart(2, "0")}-${String(pd.getDate()).padStart(2, "0")}`;
            if (sorted[i].fechaDespertar !== exp) break;
          }
          const horaReg = normalizarHoraSueno(sorted[i].horaAcostarse);
          if (horaReg !== null && horaReg <= metaN) racha++;
          else break;
        }
        return racha;
      }

      /* % de días cumpliendo meta en los últimos N días */
      function cumplimientoSueno(registros, metaHora, dias) {
        if (!registros.length || !metaHora) return 0;
        const metaN = normalizarHoraSueno(metaHora);
        const corte = new Date();
        corte.setDate(corte.getDate() - dias);
        const rec = registros.filter(
          (r) => new Date(r.fechaDespertar + "T12:00:00") >= corte,
        );
        if (!rec.length) return 0;
        const ok = rec.filter(
          (r) => normalizarHoraSueno(r.horaAcostarse) <= metaN,
        ).length;
        return Math.round((ok / rec.length) * 100);
      }

      /* Promedio hora acostarse (últimos N días) → string "HH:MM" */
      function promedioHoraSueno(registros, dias) {
        const corte = new Date();
        corte.setDate(corte.getDate() - dias);
        const rec = registros.filter(
          (r) => new Date(r.fechaDespertar + "T12:00:00") >= corte,
        );
        if (!rec.length) return null;
        const suma = rec.reduce(
          (a, r) => a + (normalizarHoraSueno(r.horaAcostarse) || 0),
          0,
        );
        return horaDecAStr(suma / rec.length);
      }

      /* Mediana de hora de acostarse (últimos N días) → string "HH:MM"
         La mediana ignora valores extremos y refleja mejor el patrón real */
      function medianaHoraSueno(registros, dias) {
        const corte = new Date();
        corte.setDate(corte.getDate() - dias);
        const rec = registros.filter(
          (r) => new Date(r.fechaDespertar + "T12:00:00") >= corte,
        );
        if (!rec.length) return null;
        const valores = rec
          .map((r) => normalizarHoraSueno(r.horaAcostarse))
          .filter((v) => v !== null)
          .sort((a, b) => a - b);
        if (!valores.length) return null;
        const mid = Math.floor(valores.length / 2);
        const med =
          valores.length % 2 === 0
            ? (valores[mid - 1] + valores[mid]) / 2
            : valores[mid];
        return horaDecAStr(med);
      }

      /* Mensaje motivacional — tono sobrio, directo */
      function mensajeSueno(registros, config) {
        if (!registros.length)
          return "Empezá registrando anoche. No hace falta que sea perfecto, solo que sea real.";
        const metaHora = config?.metaHoraAcostarse || "01:00";
        const metaN = normalizarHoraSueno(metaHora);
        const sorted = [...registros].sort((a, b) =>
          b.fechaDespertar.localeCompare(a.fechaDespertar),
        );
        const ultimo = sorted[0];
        const racha = calcularRachaSueno(registros, metaHora);
        const cumpl7 = cumplimientoSueno(registros, metaHora, 7);
        const cumplioAnoche =
          normalizarHoraSueno(ultimo.horaAcostarse) <= metaN;
        if (racha >= 7)
          return `${racha} días seguidos cumpliendo la meta. Esto ya no es casualidad, es un hábito formándose.`;
        if (racha >= 3) return `${racha} días seguidos. Va tomando forma.`;
        if (cumplioAnoche && racha < 3)
          return "Bien anoche. Lo importante ahora es repetir.";
        if (!cumplioAnoche && cumpl7 >= 60)
          return "Una noche fuera del objetivo no rompe el proceso. Lo que cuenta es el patrón de la semana.";
        if (!cumplioAnoche && cumpl7 < 40)
          return "Ajustá la meta si hace falta. Una meta alcanzable es mejor que una ideal que se siente inalcanzable.";
        return "Seguí registrando. Lo que se mide, se puede cambiar.";
      }

      /* Sugerencia de próximo objetivo */
      function sugerirObjetivo(registros, config) {
        if (!config)
          return {
            sugerir: false,
            mensaje: "Configurá tu meta inicial para activar sugerencias.",
          };
        const corte = new Date();
        corte.setDate(corte.getDate() - 14);
        const rec = registros.filter(
          (r) => new Date(r.fechaDespertar + "T12:00:00") >= corte,
        );
        if (rec.length < 7)
          return {
            sugerir: false,
            mensaje:
              "Seguí registrando para que pueda sugerirte un próximo paso.",
          };
        const metaHora = config.metaHoraAcostarse;
        const metaN = normalizarHoraSueno(metaHora);
        const cumpl = cumplimientoSueno(registros, metaHora, 14);
        const promN =
          rec.reduce(
            (a, r) => a + (normalizarHoraSueno(r.horaAcostarse) || 0),
            0,
          ) / rec.length;
        if (cumpl >= 70) {
          return {
            sugerir: true,
            nuevaMeta: horaDecAStr(metaN - 0.5),
            razon: `Cumpliste la meta el ${cumpl}% de los últimos 14 días. Probemos adelantar 30 minutos.`,
          };
        }
        if (cumpl >= 40)
          return {
            sugerir: false,
            mensaje: "Seguí consolidando la meta actual antes de avanzar.",
          };
        return {
          sugerir: true,
          nuevaMeta: horaDecAStr(promN - 0.25),
          razon:
            "Ajustemos la meta a algo más cercano a tu ritmo actual. Pequeños pasos son más sostenibles.",
        };
      }

      /* ── Gráfico semanal (barras) ── */
      function SuenoChartSemanal({ registros, metaHora }) {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        useEffect(() => {
          if (!canvasRef.current) return;
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
          const metaN = normalizarHoraSueno(metaHora) || 25;
          const dias = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            dias.push(dateStr(d));
          }
          const labels = dias.map((d) => {
            const w = new Date(d + "T12:00:00").getDay();
            return ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"][w];
          });
          const values = dias.map((d) => {
            const r = registros.find((x) => x.fechaDespertar === d);
            return r ? normalizarHoraSueno(r.horaAcostarse) : null;
          });
          const colors = values.map((v) =>
            v === null
              ? "rgba(160,153,140,.25)"
              : v <= metaN
                ? "#4A7C5F"
                : v <= metaN + 1
                  ? "#C8922A"
                  : "#C85A2A",
          );
          chartRef.current = new Chart(canvasRef.current, {
            type: "bar",
            data: {
              labels,
              datasets: [
                {
                  label: "Acostarse",
                  data: values,
                  backgroundColor: colors,
                  borderRadius: 6,
                  borderSkipped: false,
                },
                {
                  type: "line",
                  label: "Meta",
                  data: Array(7).fill(metaN),
                  borderColor: "#C8922A",
                  borderWidth: 2,
                  borderDash: [6, 4],
                  pointRadius: 0,
                  fill: false,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  min: 20,
                  max: 32,
                  ticks: {
                    callback: (v) => horaDecAStr(v),
                    color: "#7A9485",
                    font: { family: "'DM Mono', monospace", size: 11 },
                  },
                  grid: { color: "rgba(45,90,61,.12)" },
                },
                x: {
                  ticks: {
                    color: "#4A6357",
                    font: { family: "'Nunito', sans-serif", size: 12 },
                  },
                  grid: { display: false },
                },
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      if (ctx.datasetIndex === 1) return `Meta: ${metaHora}`;
                      if (ctx.raw === null) return "Sin registro";
                      const r = registros.find(
                        (x) => x.fechaDespertar === dias[ctx.dataIndex],
                      );
                      return [
                        `Acostarse: ${horaDecAStr(ctx.raw)}`,
                        r ? `Dormido: ${minAHoras(r.duracionMin)}` : "",
                      ];
                    },
                  },
                },
              },
            },
          });
          return () => {
            if (chartRef.current) {
              chartRef.current.destroy();
              chartRef.current = null;
            }
          };
        }, [registros, metaHora]);
        return (
          <div style={{ height: "200px", position: "relative" }}>
            <canvas ref={canvasRef} />
          </div>
        );
      }

      /* ── Gráfico mensual (línea) ── */
      function SuenoChartMensual({ registros, metaHora }) {

        const chartRef = useRef(null);
        useEffect(() => {

          const metaN = normalizarHoraSueno(metaHora) || 25;

          for (let i = 29; i >= 0; i--) {

                  pointRadius: 3,

                },
                {
                  label: "Meta",

                  borderColor: "#C8922A",
                  borderWidth: 2,
                  borderDash: [6, 4],
                  pointRadius: 0,
                  fill: false,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  min: 20,
                  max: 32,
                  ticks: {
                    callback: (v) => horaDecAStr(v),
                    color: "#7A9485",
                    font: { family: "'DM Mono', monospace", size: 10 },
                  },
                  grid: { color: "rgba(45,90,61,.12)" },

                    label: (ctx) =>
                      ctx.datasetIndex === 1

                          ? `Acostarse: ${horaDecAStr(ctx.raw)}`
                          : "Sin registro",

                },
              },
            },
          });
          return () => {
            if (chartRef.current) {
              chartRef.current.destroy();
              chartRef.current = null;
            }
          };
        }, [registros, metaHora]);
        return (
          <div style={{ height: "220px", position: "relative" }}>
            <canvas ref={canvasRef} />
          </div>
        );
      }

      /* ── Modal único de registro de sueño ── */
      function ModalRegistroSueno({ onClose, onGuardar }) {
        const hoy = dateStr(new Date());
        const ayer = dateStr(new Date(Date.now() - 86400000));
        const [f, setF] = useState({
          fechaDormir: ayer,
          horaAcostarse: "",
          fechaDespertar: hoy,
          horaDespertar: "",
          calidad: 3,
          notas: "",
        });
        const [mostrarCalidad, setMostrarCalidad] = useState(false);
        const [mostrarNotas, setMostrarNotas] = useState(false);
        const [warn, setWarn] = useState(null);

        /* Inputs de hora en texto puro 24h — sin AM/PM */
        function fmtHora(v) {
          const d = v.replace(/\D/g, "").slice(0, 4);
          return d.length > 2 ? d.slice(0, 2) + ":" + d.slice(2) : d;
        }
        function completarHora(v) {
          const d = v.replace(/\D/g, "");
          if (!d) return "";
          if (d.length === 1) return "0" + d + ":00";
          if (d.length === 2) return d + ":00";
          if (d.length === 3) return "0" + d[0] + ":" + d.slice(1);
          return d.slice(0, 2) + ":" + d.slice(2, 4);
        }
        function validarHora(v) {
          if (!/^\d{2}:\d{2}$/.test(v)) return false;
          const [h, m] = v.split(":").map(Number);
          return h <= 23 && m <= 59;
        }

        function construirReg() {
          const dur = calcularDuracionMin(
            f.fechaDormir,
            f.horaAcostarse,
            f.fechaDespertar,
            f.horaDespertar,
          );
          return {
            id: genId(),
            ...f,
            duracionMin: dur,
            fechaRegistro: new Date().toISOString(),
          };
        }

        function guardar() {
          if (!f.horaAcostarse || !f.horaDespertar) {
            showToast("Ingresá la hora de acostarte y despertarte.", "warn");
            return;
          }
          if (!validarHora(f.horaAcostarse) || !validarHora(f.horaDespertar)) {
            showToast(
              "Hora inválida. Usá el formato HH:MM (00:00 – 23:59).",
              "warn",
            );
            return;
          }
          const reg = construirReg();
          if (reg.duracionMin > 900) {
            setWarn(reg);
            return;
          }
          onGuardar(reg);
          onClose();
        }

        if (warn) {
          const h = Math.floor(warn.duracionMin / 60),
            m = warn.duracionMin % 60;
          return (
            <div
              style={{
                position: "fixed",
                inset: 0,
                background: "rgba(30,61,43,.55)",
                zIndex: 300,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                padding: "16px",
              }}
            >
              <div
                style={{
                  background: "var(--vd)",
                  border: "2px solid var(--vm)",
                  borderRadius: "var(--r)",
                  width: "100%",
                  maxWidth: "420px",
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    height: "4px",
                    background: "linear-gradient(90deg,var(--do),#E8B84B)",
                  }}
                />
                <div style={{ padding: "24px" }}>
                  <div
                    style={{
                      fontFamily: "var(--serif)",
                      fontSize: "17px",
                      color: "var(--do)",
                      marginBottom: "12px",
                    }}
                  >
                    ⚠️ Verificá la duración
                  </div>
                  <div
                    style={{
                      color: "rgba(255,255,255,.82)",
                      fontSize: "13px",
                      lineHeight: 1.7,
                      marginBottom: "20px",
                    }}
                  >
                    La duración calculada es de{" "}
                    <strong style={{ color: "var(--do)" }}>
                      {h} horas {m} minutos
                    </strong>
                    . Verificá que las fechas y horas ingresadas sean correctas.
                  </div>
                  <div style={{ display: "flex", gap: "10px" }}>
                    <button
                      type="button"
                      onClick={() => setWarn(null)}
                      style={{
                        flex: 1,
                        padding: "10px",
                        borderRadius: "50px",
                        border: "1px solid rgba(255,255,255,.2)",
                        background: "transparent",
                        color: "rgba(255,255,255,.7)",
                        cursor: "pointer",
                        fontFamily: "var(--sans)",
                        fontWeight: 600,
                      }}
                    >
                      Revisar
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        onGuardar(warn);
                        onClose();
                      }}
                      style={{
                        flex: 1,
                        padding: "10px",
                        borderRadius: "50px",
                        background: "var(--do)",
                        color: "var(--vd)",
                        border: "none",
                        cursor: "pointer",
                        fontWeight: 700,
                        fontFamily: "var(--sans)",
                      }}
                    >
                      Guardar igual
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(30,61,43,.55)",
              zIndex: 300,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              padding: "16px",
            }}
          >
            <div
              style={{
                background: "var(--vd)",
                border: "2px solid var(--vm)",
                borderRadius: "var(--r)",
                width: "100%",
                maxWidth: "480px",
                overflow: "hidden",
                maxHeight: "90vh",
                overflowY: "auto",
              }}
            >
              <div
                style={{
                  height: "4px",
                  background: "linear-gradient(90deg,var(--do),#E8B84B)",
                  position: "sticky",
                  top: 0,
                }}

              <div style={{ padding: "22px" }}>
                <div
                  style={{
                    fontFamily: "var(--serif)",
                    fontSize: "18px",
                    color: "var(--do)",
                    marginBottom: "18px",
                  }}
                >
                  📝 Nuevo registro
                </div>

                {/* Fila 1: Fecha acostarse + Hora acostarse (texto puro) */}
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: "12px",
                    marginBottom: "12px",
                  }}
                >
                  <div>
                    <label style={suenoModalLabel}>Fecha me acosté</label>
                    <input
                      type="date"
                      value={f.fechaDormir}
                      onChange={(e) =>
                        setF({ ...f, fechaDormir: e.target.value })
                      }
                      style={suenoModalInput}
                    />
                  </div>
                  <div>
                    <label style={suenoModalLabel}>Hora me acosté</label>
                    <input
                      type="text"
                      placeholder="--:--"
                      value={f.horaAcostarse}
                      maxLength={5}
                      onChange={(e) =>
                        setF({ ...f, horaAcostarse: fmtHora(e.target.value) })
                      }
                      onBlur={() => {
                        if (f.horaAcostarse)
                          setF((p) => ({
                            ...p,
                            horaAcostarse: completarHora(p.horaAcostarse),
                          }));
                      }}
                      style={{
                        ...suenoModalInput,
                        letterSpacing: ".1em",
                        textAlign: "center",

                  <div>

                    <input

      /* ── Tab: Tendencia del mes ── */
      function TabSuenoTendencia({ registros, config }) {
        const metaHora = config?.metaHoraAcostarse || "01:00";
        const cumpl30 = cumplimientoSueno(registros, metaHora, 30);
        const prom30 = promedioHoraSueno(registros, 30);
        const racha = calcularRachaSueno(registros, metaHora);

        /* Tendencia: promedio últimos 7 días vs. 7 días previos */
        const tendencia = (() => {
          const c7 = new Date();
          c7.setDate(c7.getDate() - 7);
          const c14 = new Date();
          c14.setDate(c14.getDate() - 14);
          const r7 = registros.filter(
            (r) => new Date(r.fechaDespertar + "T12:00:00") >= c7,
          );
          const r7p = registros.filter((r) => {
            const d = new Date(r.fechaDespertar + "T12:00:00");
            return d >= c14 && d < c7;
          });
          if (!r7.length || !r7p.length) return "→";
          const p7 =
            r7.reduce(
              (a, r) => a + (normalizarHoraSueno(r.horaAcostarse) || 0),
              0,
            ) / r7.length;
          const p7p =
            r7p.reduce(
              (a, r) => a + (normalizarHoraSueno(r.horaAcostarse) || 0),
              0,
            ) / r7p.length;
          return p7 < p7p - 0.25 ? "↑" : p7 > p7p + 0.25 ? "↓" : "→";
        })();

        const metricas = [
          { label: "Promedio del mes", value: prom30 || "--:--" },
          { label: "Mejor racha del mes", value: `${racha} días` },
          { label: "Cumplimiento (30d)", value: `${cumpl30}%` },
          {
            label: "Tendencia últimos 7d",
            value:
              tendencia === "↑"
                ? "↑ Mejorando"
                : tendencia === "↓"
                  ? "↓ Empeorando"
                  : "→ Estable",
          },
        ];

        /* Correlación de palabras en notas */
        const correlacion = (() => {
          const conNotas = registros.filter(
            (r) => r.notas && r.notas.length > 3,
          );
          if (conNotas.length < 5) return null;
          const metaN = normalizarHoraSueno(metaHora);
          const stop = new Set([
            "que",
            "con",
            "una",
            "por",
            "para",
            "pero",
            "como",
            "este",
            "esta",
            "son",
            "los",
            "las",
            "del",
            "mas",
            "muy",
            "era",
            "fue",
            "hay",
            "sus",
            "sin",
            "todo",
            "cada",
            "bien",
            "tuve",
            "algo",
          ]);
          function top(regs) {
            const f = {};
            regs.forEach((r) =>
              (r.notas || "")
                .toLowerCase()
                .split(/\s+/)
                .forEach((p) => {
                  const c = p.replace(/[^a-záéíóúñ]/gi, "");
                  if (c.length >= 4 && !stop.has(c)) f[c] = (f[c] || 0) + 1;
                }),
            );
            return Object.entries(f)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5)
              .map(([p]) => p);
          }
          const tardes = conNotas.filter(
            (r) => normalizarHoraSueno(r.horaAcostarse) > metaN,
          );
          const temprano = conNotas.filter(
            (r) => normalizarHoraSueno(r.horaAcostarse) <= metaN,
          );
          return { tardes: top(tardes), temprano: top(temprano) };
        })();

        return (
          <div>
            <div
              style={{
                background: "#FAF7F2",
                border: "2px solid #B8B0A0",
                borderRadius: "var(--r)",
                padding: "18px",
                marginBottom: "16px",
              }}
            >
              <div
                style={{
                  fontFamily: "var(--serif2)",
                  fontSize: "14px",
                  fontWeight: 700,
                  color: "var(--vd)",
                  marginBottom: "12px",
                }}
              >
                Últimos 30 días
              </div>
              <SuenoChartMensual registros={registros} metaHora={metaHora} />
            </div>

            <div
              style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: "12px",
                marginBottom: "16px",
              }}
            >
              {metricas.map((s) => (
                <div
                  key={s.label}
                  style={{
                    background: "#FAF7F2",
                    border: "2px solid #B8B0A0",
                    borderRadius: "var(--r)",
                    padding: "14px 16px",
                    position: "relative",
                    overflow: "hidden",
                  }}
                >
                  <div
                    style={{
                      position: "absolute",
                      top: 0,
                      left: 0,
                      right: 0,
                      height: "3px",
                      background: "var(--do)",
                    }}
                  />
                  <div
                    style={{
                      fontFamily: "var(--mono)",
                      fontSize: "10px",
                      textTransform: "uppercase",
                      color: "var(--tx3)",
                      marginBottom: "4px",
                    }}
                  >
                    {s.label}
                  </div>
                  <div
                    style={{
                      fontFamily: "var(--data)",
                      fontSize: "20px",
                      fontWeight: 700,
                      color: "var(--vd)",
                    }}
                  >
                    {s.value}
                  </div>
                </div>
              ))}
            </div>

            {correlacion ? (
              <div
                style={{
                  background: "#FAF7F2",
                  border: "2px solid #B8B0A0",
                  borderRadius: "var(--r)",
                  padding: "16px",
                }}
              >
                <div
                  style={{
                    fontFamily: "var(--serif2)",
                    fontSize: "14px",
                    fontWeight: 700,
                    color: "var(--vd)",
                    marginBottom: "12px",
                  }}
                >
                  Palabras frecuentes en notas
                </div>
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr",
                    gap: "12px",
                  }}
                >
                  {[
                    {
                      titulo: "Noches tarde",
                      palabras: correlacion.tardes,
                      color: "var(--do)",
                      bg: "rgba(200,146,42,.12)",
                    },
                    {
                      titulo: "Noches a tiempo",
                      palabras: correlacion.temprano,
                      color: "var(--vc)",
                      bg: "rgba(74,124,95,.12)",
                    },
                  ].map((col) => (
                    <div key={col.titulo}>
                      <div
                        style={{
                          fontFamily: "var(--mono)",
                          fontSize: "10px",
                          color: "var(--tx3)",
                          textTransform: "uppercase",
                          marginBottom: "8px",
                        }}
                      >
                        {col.titulo}
                      </div>
                      <div
                        style={{
                          display: "flex",
                          flexWrap: "wrap",
                          gap: "6px",
                        }}
                      >
                        {col.palabras.length ? (
                          col.palabras.map((p) => (
                            <span
                              key={p}
                              style={{
                                background: col.bg,
                                color: col.color,
                                padding: "3px 10px",
                                borderRadius: "20px",
                                fontSize: "12px",
                                fontFamily: "var(--mono)",
                              }}
                            >
                              {p}
                            </span>
                          ))
                        ) : (
                          <span
                            style={{ color: "var(--tx3)", fontSize: "12px" }}
                          >
                            Insuficientes notas
                          </span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div
                style={{
                  background: "rgba(45,90,61,.06)",
                  borderRadius: "var(--r)",
                  padding: "14px 16px",
                  color: "var(--tx3)",
                  fontSize: "13px",
                }}
              >
                Agregá notas a tus registros para ver correlaciones entre
                palabras y horarios.
              </div>
            )}
          </div>
        );
      }

      /* ── Tab: Historial ── */
      function TabSuenoHistorial({ registros, onEliminar }) {
        const sorted = [...registros].sort((a, b) =>
          b.fechaDespertar.localeCompare(a.fechaDespertar),
        );
        const [pag, setPag] = useState(0);
        const POR_PAG = 10;
        const paginas = Math.ceil(sorted.length / POR_PAG);
        const pagActual = sorted.slice(pag * POR_PAG, (pag + 1) * POR_PAG);

        if (!registros.length)
          return (
            <div
              style={{
                textAlign: "center",
                padding: "40px 20px",
                color: "var(--tx3)",
                fontSize: "14px",
              }}
            >
              No hay registros aún. Empezá desde "Hoy y esta semana".
            </div>
          );

        return (
          <div>
            <div className="tbl-wrap">
              <table className="tbl" style={{ width: "100%" }}>
                <thead>
                  <tr>
                    {[
                      "Desperté",
                      "Acostarse",
                      "Despertar",
                      "Duración",
                      "Calidad",
                      "Notas",
                      "",
                    ].map((h, i) => (
                      <th key={i}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {pagActual.map((r) => (
                    <tr key={r.id}>
                      <td
                        style={{ fontFamily: "var(--mono)", fontSize: "12px" }}
                      >
                        {r.fechaDespertar}
                      </td>
                      <td
                        style={{ fontFamily: "var(--mono)", fontSize: "12px" }}
                      >
                        {r.horaAcostarse}
                      </td>
                      <td
                        style={{ fontFamily: "var(--mono)", fontSize: "12px" }}
                      >
                        {r.horaDespertar}
                      </td>
                      <td
                        style={{ fontFamily: "var(--mono)", fontSize: "12px" }}
                      >
                        {minAHoras(r.duracionMin)}
                      </td>
                      <td>{"⭐".repeat(r.calidad || 0)}</td>
                      <td
                        style={{
                          maxWidth: "140px",
                          overflow: "hidden",
                          textOverflow: "ellipsis",
                          whiteSpace: "nowrap",
                          fontSize: "12px",
                          color: "var(--tx2)",
                        }}
                        title={r.notas}
                      >
                        {r.notas || "—"}
                      </td>
                      <td>
                        <button
                          onClick={() => onEliminar(r.id)}
                          style={{
                            padding: "3px 10px",
                            borderRadius: "20px",
                            border: "1px solid rgba(180,50,50,.4)",
                            background: "transparent",
                            color: "rgba(180,50,50,.8)",
                            cursor: "pointer",
                            fontSize: "11px",
                            fontFamily: "var(--sans)",
                          }}
                        >
                          Eliminar
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {paginas > 1 && (
              <div
                style={{
                  display: "flex",
                  justifyContent: "center",
                  gap: "8px",
                  marginTop: "14px",
                }}
              >
                {Array.from({ length: paginas }).map((_, i) => (
                  <button
                    key={i}
                    onClick={() => setPag(i)}
                    style={{
                      padding: "5px 12px",
                      borderRadius: "20px",
                      border: "1.5px solid",
                      cursor: "pointer",
                      fontFamily: "var(--mono)",
                      fontSize: "12px",
                      borderColor: pag === i ? "var(--do)" : "var(--crb)",
                      background: pag === i ? "var(--do)" : "transparent",
                      color: pag === i ? "var(--vd)" : "var(--tx2)",
                    }}
                  >
                    {i + 1}
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      }

      /* ── Componente principal: SubModuloSueno ── */
      function SubModuloSueno({ onBack }) {
        const [registros, setRegistros] = useState(() => {
          // Limpieza única de datos de prueba (fase 2 testing)
          if (!localStorage.getItem("hgsp_sueno_clean_v1")) {
            localStorage.removeItem("hgsp_sueno_registros");
            localStorage.setItem("hgsp_sueno_clean_v1", "1");
          }
          return getData("hgsp_sueno_registros");
        });
        const [config, setConfig] = useState(() => {
          const raw = localStorage.getItem("hgsp_sueno_config");
          return raw ? JSON.parse(raw) : null;
        });
        const [tabActiva, setTabActiva] = useState("dashboard");
        const [metaOnboarding, setMetaOnboarding] = useState("01:00");

        function guardarMetaInicial() {
          const cfg = {
            metaHoraAcostarse: metaOnboarding,
            metaHorasDormir: 7,
            fechaMetaCreada: dateStr(new Date()),
          };
          setData("hgsp_sueno_config", cfg);
          setData("hgsp_sueno_registros", []);
          setData("hgsp_sueno_objetivos_historial", []);
          setConfig(cfg);
          setRegistros([]);
          showToast("Meta guardada. Empezá registrando tu primer noche.");
        }

        function eliminarRegistro(id) {
          const todos = registros.filter((r) => r.id !== id);
          setData("hgsp_sueno_registros", todos);
          setRegistros(todos);
          showToast("Registro eliminado.");

        const TABS = [

          { id: "tendencia", label: "📈 Tendencia del mes" },

                  e.stopPropagation();

                style={{
                  padding: "7px 16px",
                  borderRadius: "50px",
                  background: "var(--vm)",
                  color: "#FFFFFF",
                  border: "none",
                  cursor: "pointer",
                  fontFamily: "var(--sans)",
                  fontSize: "13px",
                  fontWeight: 600,
                  flexShrink: 0,
                }}
              >
                ← Volver
              </button>
              <div className="page-header" style={{ flex: 1, marginBottom: 0 }}>
                <div className="page-header-icon">😴</div>
                <div>
                  <div className="page-header-title">Sueño</div>
                  <div className="page-header-sub">
                    Registro y seguimiento del hábito de sueño
                  </div>
                </div>
              </div>
            </div>

            {!config ? (
              /* ONBOARDING */
              <div
                style={{
                  background: "var(--vd)",
                  border: "2px solid var(--vm)",
                  borderRadius: "var(--r)",
                  padding: "28px",
                  maxWidth: "440px",
                  margin: "0 auto",
                }}
              >
                <div
                  style={{
                    height: "4px",
                    background: "linear-gradient(90deg,var(--do),#E8B84B)",

                    marginBottom: "20px",

                />
                <div
                  style={{
                    fontFamily: "var(--serif)",
                    fontSize: "20px",
                    color: "var(--do)",
                    marginBottom: "8px",
                  }}
                >
                  Definamos tu meta de hora de acostarse
                </div>

                <div style={{ marginBottom: "20px" }}>

        );

      /* Componente principal del módulo Vida y Hogar */
      function SeccionVidaHogar({ onNavigate }) {
        const [catAbierta, setCatAbierta] = useState(null);
        const [panelAbierto, setPanelAbierto] = useState(null);
        const [subModulo, setSubModulo] = useState(null);

        if (subModulo === "sueno")
          return <SubModuloSueno onBack={() => setSubModulo(null)} />;

        function toggleCat(id) {
          setCatAbierta((prev) => (prev === id ? null : id));
          setPanelAbierto(null);
        }

        function clickHijo(hijo) {
          if (hijo.estado === "enlazado") {
            onNavigate(hijo.enlaceA);
            return;
          }
          if (hijo.modulo) {
            setSubModulo(hijo.modulo);
            return;
          }
          // activo (proximamente) y pendiente: toggle panel inline
          setPanelAbierto((prev) => (prev === hijo.id ? null : hijo.id));
        }

        function colorEstado(estado) {
          if (estado === "activo")
            return "#96690E"; /* dorado oscuro — legible sobre crema */
          if (estado === "enlazado") return "var(--vm)"; /* verde medio */
          return "#7A6F65"; /* marrón-gris cálido */
        }

        function bgEstado(estado) {
          if (estado === "activo") return "#FFF4DC"; /* crema dorada */
          if (estado === "enlazado") return "#E8F0EB"; /* crema verde */
          return "#EAE4DA"; /* crema marrón */
        }

        function borderEstado(estado) {
          if (estado === "activo") return "#D4A030"; /* dorado */
          if (estado === "enlazado") return "#4A7C5F"; /* verde */
          return "#C0B5A8"; /* marrón claro */
        }

        function borderLeftEstado(estado) {
          if (estado === "activo") return "var(--do)";
          if (estado === "enlazado") return "var(--vc)";
          return "#B0A496";
        }

        function catActiva(cat) {
          return cat.hijos.some((h) => h.estado === "activo");
        }

        return (
          <div style={{ maxWidth: "780px", margin: "0 auto" }}>
            {/* Encabezado de página */}
            <div className="page-header" style={{ marginBottom: "28px" }}>
              <div className="page-header-icon">🌳</div>
              <div>
                <div className="page-header-title">Vida y Hogar</div>
                <div className="page-header-sub">
                  Organización personal —{" "}
                  {ARBOL_VIDA.reduce((a, c) => a + c.hijos.length, 0)} módulos ·{" "}
                  {ARBOL_VIDA.reduce(
                    (a, c) =>
                      a + c.hijos.filter((h) => h.estado === "activo").length,
                    0,
                  )}{" "}
                  activos
                </div>
              </div>
            </div>

            {/* Árbol de categorías */}
            {ARBOL_VIDA.map((cat) => {
              const abierta = catAbierta === cat.id;
              const activos = cat.hijos.filter(
                (h) => h.estado === "activo",
              ).length;
              const pendientes = cat.hijos.filter(
                (h) => h.estado === "pendiente",
              ).length;

              /* Colores por estado del ítem hijo */
              function bgHijo(estado) {
                if (estado === "activo")
                  return "#F5D898"; /* crema dorada — protagonista */
                if (estado === "enlazado")
                  return "#C8D8BE"; /* crema verde suave */
                return "#D8CEBC"; /* beige apagado — no compite */
              }
              function borderLeftHijo(estado) {
                if (estado === "activo")
                  return "#C8922A"; /* dorado var(--do) */
                if (estado === "enlazado") return "#4A7C5F"; /* verde */
                return "#A09888"; /* marrón gris muy neutro */
              }
              function textHijo(estado) {
                if (estado === "activo")
                  return "#6B4200"; /* dorado oscuro — prominente */
                if (estado === "enlazado") return "#1E3D2B"; /* verde oscuro */
                return "#6A6258"; /* gris-marrón apagado */
              }

              return (
                <div
                  key={cat.id}
                  style={{
                    marginBottom: "12px",
                    borderRadius: "18px",
                    border: "1.5px solid #1A1A18",
                    boxShadow: "4px 4px 0px rgba(0,0,0,0.75)",
                    overflow: "hidden",
                  }}
                >
                  {/* Header de categoría */}
                  <div
                    onClick={() => toggleCat(cat.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: "12px",
                      padding: "14px 18px",
                      background: catActiva(cat) ? "var(--vm)" : "#7A6F65",
                      cursor: "pointer",
                      userSelect: "none",
                      borderRadius: abierta ? "16px 16px 0 0" : "16px",
                      borderBottom: abierta
                        ? "1.5px solid rgba(0,0,0,0.4)"
                        : "none",
                      transition: "border-radius .2s",
                    }}
                  >
                    <span style={{ fontSize: "20px" }}>{cat.emoji}</span>
                    <div style={{ flex: 1 }}>
                      <div
                        style={{
                          fontFamily: "var(--serif)",
                          fontSize: "15px",
                          fontWeight: 700,
                          color: "#fff",
                        }}
                      >
                        {cat.label}
                      </div>
                      <div
                        style={{
                          fontFamily: "var(--mono)",
                          fontSize: "10px",
                          color: "rgba(255,255,255,.65)",
                          marginTop: "1px",
                        }}
                      >
                        {activos} activos · {pendientes} pendientes
                      </div>
                    </div>
                    <span
                      style={{
                        color: "rgba(255,255,255,.8)",
                        fontSize: "13px",
                        transition: "transform .2s",
                        display: "inline-block",
                        transform: abierta ? "rotate(180deg)" : "rotate(0deg)",
                      }}
                    >
                      ▼
                    </span>
                  </div>

                  {/* Hijos */}
                  {abierta && (
                    <div
                      style={{
                        background: "#4E6352",
                        borderRadius: "0 0 16px 16px",
                        padding: "10px 12px 12px",
                      }}
                    >
                      {cat.hijos.map((hijo) => (
                        <div key={hijo.id}>
                          <div
                            onClick={() => clickHijo(hijo)}
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: "10px",
                              padding: "10px 14px 10px 12px",
                              marginBottom:
                                panelAbierto === hijo.id ? "0" : "6px",
                              borderRadius:
                                panelAbierto === hijo.id
                                  ? "10px 10px 0 0"
                                  : "10px",
                              background: bgHijo(hijo.estado),
                              border: "1.5px solid #1A1A18",
                              borderLeft: `6px solid ${borderLeftHijo(hijo.estado)}`,
                              boxShadow:
                                "2.5px 3px 0px rgba(0,0,0,0.55), inset 1px 1px 3px rgba(255,255,255,0.45)",
                              cursor: "pointer",
                              transition: "box-shadow .15s",
                            }}
                          >
                            <span
                              style={{
                                fontSize: "16px",
                                background: "#FFFFFF",
                                borderRadius: "50%",
                                width: "30px",
                                height: "30px",
                                display: "inline-flex",
                                alignItems: "center",
                                justifyContent: "center",
                                flexShrink: 0,
                              }}
                            >
                              {hijo.emoji}
                            </span>
                            <span
                              style={{
                                flex: 1,
                                fontSize: "13px",
                                fontWeight: 600,
                                color: textHijo(hijo.estado),
                              }}
                            >
                              {hijo.label}
                            </span>
                            {hijo.estado === "enlazado" && (
                              <span
                                style={{
                                  fontSize: "12px",
                                  color: "#2D5A3D",
                                  fontWeight: 700,
                                }}
                              >
                                →
                              </span>
                            )}
                            {hijo.estado === "activo" && (
                              <span
                                style={{
                                  fontFamily: "var(--mono)",
                                  fontSize: "9px",
                                  fontWeight: 700,
                                  background: "var(--do)",
                                  color: "var(--vd)",
                                  padding: "3px 9px",
                                  borderRadius: "10px",
                                  border: "1.5px solid #1A1A18",
                                  boxShadow: "1.5px 2px 0px rgba(0,0,0,0.45)",
                                }}
                              >
                                PRÓXIMO
                              </span>
                            )}
                            {hijo.estado === "pendiente" && (
                              <span
                                style={{
                                  fontFamily: "var(--mono)",
                                  fontSize: "9px",
                                  fontWeight: 500,
                                  color: "#8A8278",
                                  background: "#C8C0B4",
                                  padding: "2px 8px",
                                  borderRadius: "10px",
                                }}
                              >
                                pendiente
                              </span>
                            )}
                          </div>
                          {panelAbierto === hijo.id && (
                            <PanelPorConstruirse
                              id={hijo.id}
                              proximamente={hijo.proximamente}
                            />
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      }
      /* ═══════════════════════════════════════════════════ */

      function App() {
        return (
          <div style={{minHeight:'100vh', background:'var(--cr)'}}>
            <ToastContainer />
            <div className="topbar-vh">
              <a href="index.html" className="topbar-vh-back">← App principal</a>
              <span className="topbar-vh-title">🌳 Vida y Hogar</span>
              <button className="topbar-vh-signout" onClick={()=>authSignOut()}>🚪 Cerrar sesión</button>
            </div>
            <div className="vh-main">
              <SeccionVidaHogar onNavigate={()=>{}} />
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
